<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rodokmen Vorkových a Gemerových</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Alegreya+Sans:wght@400;700&display=swap">
<style>
:root{--bg:#EDF1F0;--surface:#FBFCFC;--fg:#1C262E;--muted:#5A6870;--line:#D2DAD9;--accent:#2C4F73;--err:#A33A2A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121A1F;--surface:#18222A;--fg:#E2E8EA;--muted:#9AA8AF;--line:#2C3940;--accent:#93B7DC;--err:#E58A78;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Alegreya Sans","Segoe UI",system-ui,sans-serif;font-size:17px;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2rem 1.8rem}
.mark{display:block;margin-bottom:1rem}
.eyebrow{font-size:.75rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:Alegreya,Georgia,serif;font-weight:800;font-size:2rem;line-height:1.1;margin:.3rem 0 .6rem}
p{margin:0 0 1.3rem;color:var(--muted)}
label{display:block;font-weight:700;font-size:.92rem;margin-bottom:.35rem}
input[type=password]{width:100%;font:inherit;padding:.65rem .8rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:.5rem;margin:.8rem 0 1.2rem;font-size:.92rem;color:var(--muted)}
button{width:100%;font:inherit;font-weight:700;padding:.7rem;border:0;border-radius:6px;background:var(--accent);color:var(--surface);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--err);font-weight:700;font-size:.92rem;min-height:1.4em;margin:.6rem 0 0}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">

  <div class="eyebrow">Rodinný web</div>
  <h1>Rodokmen Vorkových a Gemerových</h1>
  <p>Web je jen pro rodinu. Zadejte heslo, které vám poslal Ivo.</p>
  <input type="text" name="username" value="rodina" autocomplete="username" hidden>
  <label for="pw">Heslo</label>
  <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus>

  <div class="err" id="err" role="alert"></div>
</form>

const K="rodokmen-key";
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(IV)}, key, b(CT));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b(SALT), iterations:IT, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
(async () => {
  try { const raw = localStorage.getItem(K); if (raw){ const key = await crypto.subtle.importKey('raw', b(raw), 'AES-GCM', false, ['decrypt']); await open(key); } }
  catch(e){ try{ localStorage.removeItem(K); }catch(_){} }
})();
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Ověřuji…'; err.textContent = '';
  try {
    const key = await derive(document.getElementById('pw').value.trim());
    await crypto.subtle.decrypt({name:'AES-GCM', iv:b(IV)}, key, b(CT));
    if (document.getElementById('rem').checked){ try{ const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key)); localStorage.setItem(K, btoa(String.fromCharCode(...raw))); }catch(_){} }
    await open(key);
  } catch(_){
    err.textContent = 'Heslo nesedí. Zkuste to znovu.';
    btn.disabled = false; btn.textContent = 'Vstoupit';
  }
});
